<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dr. Yazid Boutiouta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F2A2C;
    --card: #F6F1E7;
    --ink: #1E2422;
    --ink-soft: #4A524E;
    --line: #D8CFBB;
    --accent: #B98A4E;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) { --bg: #0F2A2C; }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
  }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border: 1px solid var(--line);
    padding: 48px 36px 40px;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: clamp(28px, 6vw, 34px);
    line-height: 1.15;
    margin: 0 0 6px;
    color: var(--ink);
  }
  .subtitle {
    font-size: 14px;
    color: var(--ink-soft);
    margin: 0 0 36px;
    line-height: 1.5;
  }
  .links {
    display: flex;
    flex-direction: column;
  }
  a.link-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 18px 4px;
    border-top: 1px solid var(--line);
    text-decoration: none;
    color: var(--ink);
    transition: padding-left 0.15s ease;
  }
  .links a.link-row:last-child { border-bottom: 1px solid var(--line); }
  a.link-row:hover { padding-left: 10px; }
  a.link-row:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .label {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .label .name {
    font-size: 16px;
    font-weight: 500;
  }
  .label .desc {
    font-size: 12.5px;
    color: var(--ink-soft);
  }
  .arrow {
    font-family: 'Fraunces', serif;
    font-size: 20px;
    color: var(--accent);
    flex-shrink: 0;
  }
  .icon {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    color: var(--ink-soft);
  }
  .row-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Dr. Yazid Boutiouta</h1>
    <p class="subtitle">Find me on social media, or get directions to the practice.</p>

    <div class="links">
      <a class="link-row" href="https://www.instagram.com/dr_yazid_boutiouta_?stkn=ZDNlZDc0MzIxNw==" target="_blank" rel="noopener">
        <div class="row-left">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1"/></svg>
          <div class="label">
            <span class="name">Instagram</span>
            <span class="desc">@dr_yazid_boutiouta_</span>
          </div>
        </div>
        <span class="arrow">&#8594;</span>
      </a>

      <a class="link-row" href="https://www.facebook.com/profile.php?id=61556113772549" target="_blank" rel="noopener">
        <div class="row-left">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M15 3h-2a4 4 0 0 0-4 4v3H7v4h2v7h4v-7h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
          <div class="label">
            <span class="name">Facebook</span>
            <span class="desc">Practice page</span>
          </div>
        </div>
        <span class="arrow">&#8594;</span>
      </a>

      <a class="link-row" href="https://maps.app.goo.gl/22KN3zwLRqWYaiMh9" target="_blank" rel="noopener">
        <div class="row-left">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.4"/></svg>
          <div class="label">
            <span class="name">Location</span>
            <span class="desc">Get directions</span>
          </div>
        </div>
        <span class="arrow">&#8594;</span>
      </a>
    </div>
  </div>
</body>
</html>
