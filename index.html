<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F6C836;
    --card: #7B5FD9;
    --ink: #FFFFFF;
    --ink-soft: rgba(255,255,255,0.75);
    --line: #232A4D;
    --accent: #6D8CFF;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
  }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    background: var(--bg);
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 48px 36px 40px;
  }
  .wordmark {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 30px;
    letter-spacing: -0.02em;
    margin: 0 0 6px;
    color: var(--ink);
  }
  .subtitle {
    font-size: 14px;
    color: var(--ink-soft);
    margin: 0 0 36px;
    line-height: 1.5;
  }
  .links {
    display: flex;
    flex-direction: column;
  }
  a.link-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 18px 4px;
    border-top: 1px solid var(--line);
    text-decoration: none;
    color: var(--ink);
    transition: padding-left 0.15s ease;
  }
  .links a.link-row:last-child { border-bottom: 1px solid var(--line); }
  a.link-row:hover { padding-left: 10px; }
  a.link-row:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .label {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .label .name {
    font-size: 16px;
    font-weight: 500;
  }
  .label .desc {
    font-size: 12.5px;
    color: var(--ink-soft);
  }
  .arrow {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 20px;
    color: var(--accent);
    flex-shrink: 0;
  }
  .icon {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    color: var(--ink-soft);
  }
  .row-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }
</style>
</head>
